name: rsna-ich-research
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch>=2.1
  - torchvision>=0.16
  - pytorch-cuda=12.1        # remove for CPU-only environments
  - numpy>=1.24
  - pandas>=2.0
  - pyarrow>=12
  - scikit-learn>=1.3
  - scipy>=1.10
  - matplotlib>=3.7
  - pyyaml>=6.0
  - psutil>=5.9
  - pytest>=7
  - nbformat>=5.9
  - nbclient>=0.8
  - ipykernel>=6
  - pip
  - pip:
      - timm>=0.9.12
      - pydicom>=2.4
      - opencv-python-headless>=4.8
      - pennylane>=0.36
