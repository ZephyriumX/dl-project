# Data, splitting, preprocessing and caching configuration.
# `base` applies to every mode; `modes.<mode>` overrides it. Select the mode in each notebook's
# config cell (MODE = "smoke" | "pilot" | "full"). No source code needs editing.

base:
  seed: 42
  paths:
    rsna_root: null                # explicit path; null -> auto-discovery (RSNA_DATA_ROOT env, candidates, /kaggle/input search)
    rsna_root_candidates:
      - /kaggle/input/rsna-intracranial-hemorrhage-detection
      - /kaggle/input/rsna-intracranial-hemorrhage-detection/rsna-intracranial-hemorrhage-detection
      - /kaggle/input/competitions/rsna-intracranial-hemorrhage-detection/rsna-intracranial-hemorrhage-detection
      - /kaggle/input/competitions/rsna-intracranial-hemorrhage-detection
    output_root: null              # null -> /kaggle/working/rsna_ich_artifacts (or ./rsna_ich_artifacts locally)
    artifact_input_roots: []       # extra read-only roots holding outputs of earlier notebooks (searched automatically under /kaggle/input too)

  labels:
    conflict_policy: max           # duplicate (image,label) rows with different values: max | min | drop_image | error

  header_scan:
    max_images: null               # null -> scan every labelled image (restartable); integer -> random subset (smoke)
    chunk_size: 5000
    workers: 16

  split:
    fractions: {train: 0.70, val: 0.15, test: 0.15}
    max_missing_patient_fraction: 0.01   # above this, fall back to StudyInstanceUID grouping (reported as study-level!)
    max_groups: null               # subsample *patients* before splitting (pilot); null = all
    min_positive_group_fraction: null    # optional enrichment of ICH-positive patients when subsampling (recorded)

  preprocessing:
    image_size: 224
    channel_mode: bsb              # bsb = brain/subdural/soft-tissue windows; brain3 = single brain window x3
    rsna_intercept_fix: true
    pad_to_square: true
    normalization: imagenet
    interpolation: area

  augmentation:
    enabled: true
    hflip: 0.5
    rotate_deg: 10.0
    translate: 0.05
    scale: [0.9, 1.1]
    intensity_gain: 0.05
    p_affine: 0.7

  cache:
    memory_cache_items: 0          # in-process LRU of decoded uint8 slices (per worker!)
    disk_cache_max_gb: 0.0         # >0 enables a bounded uint8 .npy cache under <output_root>/cache/<fingerprint>/

  on_decode_error: blank           # blank (counted, flagged ok=False) | raise

  visual_check_images: 6

modes:
  smoke:
    header_scan: {max_images: 4000, chunk_size: 1000}
  pilot:
    header_scan: {max_images: null}
    split: {max_groups: 1500}
    cache: {disk_cache_max_gb: 8.0}
  full:
    header_scan: {max_images: null}
    split: {max_groups: null}
    cache: {disk_cache_max_gb: 0.0}
